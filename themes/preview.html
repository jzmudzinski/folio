<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Folio v2 themes — preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: #1a1a1a; color: #eee; }
  .toolbar { position: sticky; top: 0; z-index: 10; background: #0a0a0a; padding: 14px 22px; border-bottom: 1px solid #333; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .toolbar strong { color: #fff; margin-right: 12px; }
  .toolbar button { background: #2a2a2a; color: #ddd; border: 1px solid #444; padding: 5px 11px; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: ui-monospace, monospace; }
  .toolbar button:hover { background: #3a3a3a; color: #fff; }
  .toolbar button.active { background: #fff; color: #000; border-color: #fff; }
  iframe { border: 0; width: 100%; height: calc(100vh - 56px); display: block; background: #fff; }
</style>
</head>
<body>
<div class="toolbar">
  <strong>FOLIO v2</strong>
  <span id="buttons"></span>
</div>
<iframe id="frame" src="about:blank"></iframe>
<script>
const themes = ['linen','folio','newsroom','notebook','brutalist','terminal','pastel','dossier',
                'atlas','studio','memo','codex','ledger','sumi','arcade','garden','kraft','prism'];
const newOnes = new Set(['atlas','studio','memo','codex','ledger','sumi','arcade','garden','kraft','prism']);

const sample = (theme) => `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="${theme}/theme.css"></head>
<body><main class="wrap">
<span class="eyebrow">Field report · ${theme}</span>
<h1>Why our retrieval <em>silently</em> degraded</h1>
<p class="lead">Three weeks after launch we noticed recall@10 had slipped from 0.82 to 0.61. Nothing crashed — answers just became more "generic". Here's what happened, why nobody caught it immediately, and what we fixed.</p>

<p>The first signal came from evals — a 200-query production set we keep in CI. Recall dropped gradually, day by day, around 0.7 percentage points per day. Slow enough that alerts set on 5% delta never fired. <strong>The drift was continuous, not stepwise.</strong></p>

<p>The second signal came from users, but only after 11 days. The feedback gist: "the answers are OK but kind of generic." That's a bad-quality signal — without the name of a specific missing document, the problem isn't reproducible.</p>

<h2>What we found</h2>
<p>The embedding model received silent updates from the vendor. The version number didn't change, but vectors for the same text started to differ subtly from day X. Old vector base + new query encoder = systematic cosine-distance shift.</p>

<ol>
  <li>We numbered every index with an embedding timestamp.</li>
  <li>We turned on alerts for A/B distribution shift in cosine score.</li>
  <li>Re-embed the entire corpus for new queries hitting this encoder.</li>
</ol>

<h3>Metrics before/after the fix</h3>
<table>
<thead><tr><th>Metric</th><th>Before</th><th>After</th><th>Δ</th></tr></thead>
<tbody>
<tr><td>recall@10</td><td>0.61</td><td>0.84</td><td>+0.23</td></tr>
<tr><td>p50 latency</td><td>180ms</td><td>185ms</td><td>+5ms</td></tr>
<tr><td>cost / 1k req</td><td>$0.12</td><td>$0.18</td><td>+$0.06</td></tr>
<tr><td>user CSAT</td><td>3.4</td><td>4.1</td><td>+0.7</td></tr>
</tbody>
</table>

<blockquote>You don't measure what you don't measure. Embedding version drift is the classic case of a metric that existed but nobody watched.</blockquote>

<div class="cards">
<div class="card"><h3>Takeaway 01</h3><p>Version embeddings <strong>hard</strong>. Model hash + date — in the index name.</p></div>
<div class="card"><h3>Takeaway 02</h3><p>Keep an eval set that runs every day, not just at release.</p></div>
<div class="card"><h3>Takeaway 03</h3><p>Drift is <em>continuous</em>. A delta-percentage alert misses the slow slide.</p></div>
</div>

<h3>State after the fix</h3>
<p>The re-embed took 6 hours. One-time cost: ~$340. <span class="pill good">Resolved</span> <span class="pill info">Monitored</span> <span class="pill mid">Re-embed planned Q1</span></p>

<pre><code># detect embedding drift
distances = cosine(old_queries, new_queries_re_encoded)
if distances.mean() > 0.04:
    raise EmbeddingDriftAlert(model_hash, drift=distances.mean())</code></pre>

<div class="verdict">
<h3>Recommendation</h3>
<p>Every external model gets pinned to a specific hash, not a version. Eval CI runs every day, not only at release. Alert on <strong>distribution shape</strong>, not just delta. Next review in 60 days.</p>
</div>

<hr>
<footer>Folio · ${theme} · v2.0 · 2025-01-18</footer>
</main></body></html>`;

const buttonsEl = document.getElementById('buttons');
const frame = document.getElementById('frame');
const baseUrl = location.href.replace(/[^/]+$/,'');

function show(theme) {
  document.querySelectorAll('#buttons button').forEach(b => b.classList.toggle('active', b.dataset.theme === theme));
  const blob = new Blob([sample(theme)], {type: 'text/html'});
  // need to render with base href so theme.css resolves
  const html = sample(theme).replace('<head>', `<head><base href="${baseUrl}">`);
  frame.srcdoc = html;
  location.hash = theme;
}

themes.forEach(t => {
  const b = document.createElement('button');
  b.textContent = t;
  b.dataset.theme = t;
  if (newOnes.has(t)) b.style.borderColor = '#ffd700';
  b.onclick = () => show(t);
  buttonsEl.appendChild(b);
});

show(location.hash.slice(1) || 'atlas');
</script>
</body>
</html>
